  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;

  .muted{color:var(--muted);font-size:14px;}

  .btn.stamp{background:var(--stamp);color:var(--white);}
  .btn.teal{background:var(--teal);color:var(--white);}

/* ============================= AUTH ============================= */
async function signUpUser(username, email, password, age, guardianEmail){
  const clean = username.trim().toLowerCase();
  const { data, error } = await sb.auth.signUp({
    email, password,
    options:{ data:{ username: clean }, emailRedirectTo: window.location.href }
  });
  if(error) return error.message;
  try{
    const r = await fetch('/api/register-username', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: clean, email, userId: data.user ? data.user.id : null, age, guardianEmail })
    });
    const json = await r.json();
    if(!r.ok) return json.error || 'Could not reserve that username.';
  }catch(e){ return 'Could not reserve that username.'; }
  if(age < 13 && guardianEmail && data.user){
    try{
      await fetch('/api/request-guardian-consent', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ userId: data.user.id, guardianEmail, username: clean })
      });
    }catch(e){}
  }
  return null;
}
async function loginUser(username, password){
  try{
    const lookup = await fetch('/api/login-lookup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: username.trim().toLowerCase() })
    });
    const lookupJson = await lookup.json();
    if(!lookup.ok) return lookupJson.error || 'Incorrect username or password.';
    const { error } = await sb.auth.signInWithPassword({ email: lookupJson.email, password });
    if(error) return 'Incorrect username or password.';
    return null;
  }catch(e){ return 'Something went wrong signing in.'; }
}
async function requestPasswordReset(username){
  try{
    const lookup = await fetch('/api/login-lookup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: username.trim().toLowerCase() })
    });
    const lookupJson = await lookup.json();
    if(!lookup.ok) return lookupJson.error || 'Username not found.';
    const { error } = await sb.auth.resetPasswordForEmail(lookupJson.email, { redirectTo: window.location.href });
    if(error) return error.message;
    return null;
  }catch(e){ return 'Something went wrong sending the reset email.'; }
}
async function setNewPassword(password){
  const { error } = await sb.auth.updateUser({ password });
  return error ? error.message : null;
}
async function signOut(){ await sb.auth.signOut(); state.session=null; state.profile=null; state.screen='loginScreen'; render(); }

/* ============================= BACKEND CALLS ============================= */
async function authedFetch(path, opts={}){
  const { data } = await sb.auth.getSession();
  const token = data.session ? data.session.access_token : null;
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(token) headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  const json = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(json.error || ('Request failed: '+res.status)); }
  return json;
}

    state.progress = {
      stagesCompleted: profile.stages_completed||[],
      mistakeTags: profile.mistake_tags||{},
      scoreHistory: profile.score_history||[],
      masteredSkills: profile.mastered_skills||{},
      streakCount: profile.streak_count||0,
      lastActiveDate: profile.last_active_date||null,
      totalPracticeSeconds: profile.total_practice_seconds||0,
      practiceGoalMinutes: profile.practice_goal_minutes||15,
      gems: profile.gems||0,
      avatarId: profile.avatar_id||'girl-1',
      unlockedAvatars: profile.unlocked_avatars||['girl-1','girl-2','boy-1','boy-2'],
      accentPref: profile.accent_pref||'en-US',
      dailyPracticeSeconds: profile.daily_practice_seconds||0,

    };

async function saveProfileToServer(){
  await authedFetch('/api/progress', { method:'POST', body: JSON.stringify({
    name: state.profile.name, path: state.profile.path, level: state.profile.level,
    current_stage: state.profile.currentStage,

function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  const last = state.progress.lastActiveDate;
  if(last === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  state.progress.streakCount = (last === yesterday) ? (state.progress.streakCount||0)+1 : 1;
  state.progress.lastActiveDate = today;
}
function updateDailyProgress(elapsedSeconds){
  const today = new Date().toISOString().slice(0,10);
  if(state.progress.dailyDate !== today){
    state.progress.dailyDate = today;
    state.progress.dailyPracticeSeconds = 0;
  }
  state.progress.dailyPracticeSeconds = (state.progress.dailyPracticeSeconds||0) + elapsedSeconds;
  const goalSeconds = (state.progress.practiceGoalMinutes||15)*60;
  let goalHitNow = false;
  if(state.progress.dailyPracticeSeconds >= goalSeconds && state.progress.dailyGoalRewardedDate !== today){
    state.progress.gems = (state.progress.gems||0) + 15;
    state.progress.dailyGoalRewardedDate = today;
    goalHitNow = true;
  }
  return goalHitNow;
}
function applyTheme(themeId){
  const t = THEMES.find(x=>x.id===themeId) || THEMES[0];
  document.documentElement.style.setProperty('--paper', t.paper);
  document.documentElement.style.setProperty('--paper2', t.paper2);
}
async function callBackend(endpoint, messages, system, maxTokens){
  const data = await authedFetch(endpoint, { method:'POST', body: JSON.stringify({messages, system}) });
  if(data.content) return data.content.map(b=>b.type==='text'?b.text:'').join('\n').trim();
  throw new Error('No content in response');
}
function extractJSON(text){
  let t = text.trim();
  t = t.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = t.indexOf('{'); const end = t.lastIndexOf('}');
  if(start>=0 && end>start){ t = t.slice(start, end+1); }
  return JSON.parse(t);
}

  app.appendChild(div);

    render();
  }));
  const backBtn = div.querySelector('#backQ');
  if(backBtn) backBtn.addEventListener('click', ()=>{ state.diag.idx--; render(); });

    if(state.diag.idx < DIAGNOSTIC.length-1){ state.diag.idx++; render(); } else { finishDiagnostic(); }
  });
}
async function finishDiagnostic(){
  const correctByLevel = {}; const totalByLevel = {};
  DIAGNOSTIC.forEach((q,i)=>{
    totalByLevel[q.level] = (totalByLevel[q.level]||0)+1;
    if(state.diag.answers[i] === q.a){ correctByLevel[q.level] = (correctByLevel[q.level]||0)+1; }
  });
  let level = "A1";
  for(const band of CEFR){
    const correct = correctByLevel[band]||0; const total = totalByLevel[band]||0;
    if(total>0 && correct/total >= 0.66){ level = band; }
  }
  const levelIdx = CEFR.indexOf(level); const startStage = Math.min(15, levelIdx*3 + 1);
  state.profile.level = level; state.profile.currentStage = startStage;
  await saveProfileToServer();
  state.screen = 'diagResult'; render();
}

/* ============================= CONVERSATION ============================= */
let activeTimerId = null;
function beginConversation(stage){
  if(activeTimerId){ clearInterval(activeTimerId); activeTimerId = null; }
  state.convo = {stage, messages:[], secondsLeft:180, speed:1, recognizing:false, usedVoice:false, ended:false, startedAt:Date.now()};
  state.screen='conversation'; render(); fetchAIReply(true); startTimer();
}
function convoSystemPrompt(stage){
  return `You are role-playing as a character in an English-speaking practice scenario for an ESL learner at CEFR level ${state.profile.level}.
Scenario: ${stage.scenario}
Rules:
- Stay fully in character - never break character or mention you are an AI.
- Speak in natural English calibrated to a ${state.profile.level} learner: simpler vocabulary/shorter sentences for A1/A2, natural idiomatic complexity for B1+.
- Keep each reply short: 1-3 sentences.
- Ask a question or prompt a response almost every turn.
- Do not correct the learner's grammar mid-conversation.
- Adapt to the learner as the conversation goes: if their replies are short, hesitant, or show basic errors, respond with shorter sentences, simpler vocabulary, and ask more direct, easy-to-answer questions to keep them going. If their replies are fluent, detailed, and accurate, use longer, more natural sentences and richer vocabulary, and ask more open-ended questions.
- Open the conversation with a natural first line appropriate to the scenario.`;
}
function apiMessagesFromConvo(){ return state.convo.messages.map(m=>({role: m.role==='ai'?'assistant':'user', content:m.text})); }
async function fetchAIReply(isOpening){
  const stage = state.convo.stage;
  try{
    const msgs = isOpening ? [{role:'user', content:'(Begin the scenario now with your opening line.)'}] : apiMessagesFromConvo();
    const reply = await callBackend('/api/chat', msgs, convoSystemPrompt(stage));
    state.convo.messages.push({role:'ai', text:reply}); render(); speakText(reply);
  }catch(e){
    state.convo.messages.push({role:'system', text:'('+(e.message||'Connection issue')+')'}); render();
  }
}
function speakText(text){
  try{ if(!window.speechSynthesis) return; window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = state.convo.speed;
    const lang = state.progress.accentPref || 'en-US';
    u.lang = lang;
    const voices = window.speechSynthesis.getVoices();
    const match = voices.find(v=>v.lang===lang) || voices.find(v=>v.lang.startsWith(lang.split('-')[0]));
    if(match) u.voice = match;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function startTimer(){
  if(activeTimerId){ clearInterval(activeTimerId); }
  activeTimerId = setInterval(()=>{
    state.convo.secondsLeft--;
    const el = document.getElementById('timerDisplay');
    if(el){ const m=Math.floor(Math.max(0,state.convo.secondsLeft)/60); const s=Math.max(0,state.convo.secondsLeft)%60;
      el.textContent = `${m}:${s.toString().padStart(2,'0')}`; }
    if(state.convo.secondsLeft<=0){ clearInterval(activeTimerId); activeTimerId=null; endConversation(); }
  },1000);
}
function renderConversation(app){
  const s = state.convo.stage; const div = document.createElement('div');
  const m = Math.floor(Math.max(0,state.convo.secondsLeft)/60); const sec = Math.max(0,state.convo.secondsLeft)%60;
  div.innerHTML = `

      <div class="chat-log" id="chatLog">${state.convo.messages.map(m=>`<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`).join('') || '<div class="msg system">Connecting…</div>'}</div>
      <div class="speed-row"><span>🐢</span><input type="range" min="0.6" max="1.4" step="0.1" value="${state.convo.speed}" id="speedSlider"><span>🐇</span>
        <span class="mono" id="speedVal">${state.convo.speed.toFixed(1)}x</span></div>
      <div class="chat-input-row"><button class="mic-btn" id="micBtn" title="Speak">🎤</button>
        <input type="text" id="chatInput" placeholder="Type your reply…"><button class="btn" id="sendBtn">Send</button></div>
    </div>
    <button class="btn block secondary" id="endBtn" style="margin-top:14px;">Finish &amp; get my score →</button>`;
  app.appendChild(div);
  const log = div.querySelector('#chatLog'); log.scrollTop = log.scrollHeight;
  div.querySelector('#backBtn').addEventListener('click', ()=>{
    if(activeTimerId){ clearInterval(activeTimerId); activeTimerId=null; }

  div.querySelector('#endBtn').addEventListener('click', endConversation);
  div.querySelector('#speedSlider').addEventListener('input', (e)=>{
    state.convo.speed = parseFloat(e.target.value); div.querySelector('#speedVal').textContent = state.convo.speed.toFixed(1)+'x';
  });
  div.querySelector('#sendBtn').addEventListener('click', sendUserMessage);
  div.querySelector('#chatInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendUserMessage(); });

function sendUserMessage(){
  const input = document.getElementById('chatInput'); const text = input.value.trim(); if(!text) return;
  state.convo.messages.push({role:'user', text}); input.value=''; render(); fetchAIReply(false);

function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Voice input is not supported in this browser — please type your reply instead.'); return; }
  const btn = document.getElementById('micBtn');
  if(state.convo.recognizing){ state.convo._recognizer && state.convo._recognizer.stop(); return; }
  const rec = new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  state.convo._recognizer = rec; state.convo.recognizing = true; state.convo.usedVoice = true; btn.classList.add('recording');
  rec.onresult = (e)=>{ document.getElementById('chatInput').value = e.results[0][0].transcript; };
  rec.onend = ()=>{ state.convo.recognizing=false; btn.classList.remove('recording'); };
  rec.onerror = ()=>{ state.convo.recognizing=false; btn.classList.remove('recording'); };
  rec.start();
}

/* ============================= SCORING ============================= */
async function endConversation(){
  if(state.convo.ended) return;
  state.convo.ended = true;
  if(activeTimerId){ clearInterval(activeTimerId); activeTimerId=null; }
  window.speechSynthesis && window.speechSynthesis.cancel();
  if(state.convo.messages.filter(m=>m.role==='user').length===0){ state.screen='stageDetail'; render(); return; }
  state.screen='scoring'; render();
  const transcript = state.convo.messages.map(m=>`${m.role==='ai'?'Character':'Learner'}: ${m.text}`).join('\n');
  const sys = `You are an ESL assessment engine. You will receive a transcript of a roleplay conversation between a "Character" (AI) and a "Learner" (ESL student, target level ${state.profile.level}). Assess ONLY the Learner's lines.
Respond with ONLY valid JSON, no preamble, no markdown fences, matching exactly this shape:
{"scores": {"vocabulary": <0-100 int>, "grammar": <0-100 int>, "pronunciation": <0-100 int or null>, "comprehension": <0-100 int>, "confidence": <0-100 int>},
"mistakes": [{"tag": "<short-kebab-case-grammar-or-vocab-tag>", "example": "<short quote from learner>", "correction": "<corrected version>"}],
"feedback": "<2-3 sentence encouraging but honest feedback>"}
Scoring guidance: vocabulary=range/appropriateness of word choice; grammar=tense/agreement/preposition/word order correctness; pronunciation=null (no audio access); comprehension=relevance of responses; confidence=based on response length/directness. List 1-5 concrete mistakes with reusable tags like "past-simple-irregular", "preposition-choice", "subject-verb-agreement", "article-usage". Empty array if none found.
Feedback tone: be warm and genuinely encouraging. If the scores are strong (average 85+), be enthusiastic and celebratory ("Amazing work!", "Fantastic job!") and specifically call out what they did well. If scores are mixed, lead with something genuine they did well before mentioning what to work on. Always end on an encouraging note.
Transcript:
${transcript}`;
  try{
    const raw = await callBackend('/api/score', [{role:'user', content:'Assess this transcript now.'}], sys);
    const result = extractJSON(raw);
    state.lastScoreResult = result;
    state.progress.scoreHistory.push({date: new Date().toISOString(), stage: state.convo.stage.n, scores: result.scores});
    (result.mistakes||[]).forEach(m=>{
      state.progress.mistakeTags[m.tag] = (state.progress.mistakeTags[m.tag]||0)+1;
      if(state.progress.masteredSkills[m.tag]) delete state.progress.masteredSkills[m.tag];
    });
    if(!state.progress.stagesCompleted.includes(state.convo.stage.n)){ state.progress.stagesCompleted.push(state.convo.stage.n); }
    if(state.convo.stage.n === state.profile.currentStage && state.profile.currentStage < 15){ state.profile.currentStage += 1; }
    const elapsed = Math.min(200, Math.round((Date.now() - (state.convo.startedAt||Date.now()))/1000));
    state.progress.totalPracticeSeconds = (state.progress.totalPracticeSeconds||0) + elapsed;
    state.progress.gems = (state.progress.gems||0) + 5;
    state.dailyGoalJustHit = updateDailyProgress(elapsed);
    updateStreak();
    await saveProfileToServer();
    state.screen='scoreResult'; render();
  }catch(e){
    console.error(e); state.lastScoreResult = null; state.scoreError = e.message; state.screen='scoreResult'; render();
  }
}

    <button class="btn block secondary" id="backDash">Back to journey</button>`;

async function startTargetedPractice(tag){
  state.targetedPractice = {loading:true, tag, questions:null, idx:0, correct:0};
  state.screen='targetedPractice'; render();
  const sys = `You are an ESL exercise generator. Create an adaptive, two-level practice set targeting exactly this mistake pattern: "${tag}" for a learner at CEFR level ${state.profile.level}.
Respond with ONLY valid JSON, no markdown fences: {"questions":[{"level":1,"prompt":"...","options":["a","b","c","d"],"answer":"...","explanation":"..."}, ...]}
Create exactly 8 questions total, in this order:
- Questions 1-4: level 1 - foundational, single-sentence practice of the "${tag}" pattern in isolation.
- Questions 5-8: level 2 - harder - longer or more natural sentences, sometimes combining "${tag}" with a second nearby grammar point, requiring closer reading.
Every question must have a "level" field set to exactly 1 or 2 matching its position. Vary the wording so no two questions feel repetitive.
CRITICAL JSON FORMATTING RULE: Never use a double-quote character inside any string value (no quoted dialogue, no "air quotes"). If a sentence would naturally need quotation marks, rephrase it without them or use single quotes instead. This is required for the JSON to parse correctly.`;
  try{
    const raw = await callBackend('/api/practice', [{role:'user', content:'Generate the practice set now.'}], sys);
    const result = extractJSON(raw);
    state.targetedPractice = {loading:false, tag, questions:result.questions, idx:0, correct:0, correctByLevel:{1:0,2:0}, shownLevelUp:false, levelGateChecked:false}; render();
  }catch(e){
    console.error(e); state.targetedPractice = {loading:false, tag, questions:[], idx:0, correct:0, error:e.message}; render();
  }
}
function renderTargetedPractice(app){
  const tp = state.targetedPractice; const div = document.createElement('div');
  if(tp.loading){
    div.innerHTML = `<div class="center" style="padding-top:100px;"><div class="spinner"></div><p class="muted" style="margin-top:14px;">Building practice for "${tp.tag.replace(/-/g,' ')}"…</p></div>`;
    app.appendChild(div); return;
  }
  if(tp.error || !tp.questions || tp.questions.length===0){
    div.innerHTML = `<div class="card"><h2>Couldn't build practice</h2><p class="muted">${tp.error||'Try again from the stage page.'}</p><button class="btn block" id="back">Back</button></div>`;
    app.appendChild(div); div.querySelector('#back').addEventListener('click', ()=>{ state.screen='dashboard'; render(); }); return;
  }
  const q = tp.questions[tp.idx];

  // Gate: must score 3/4 or better on level 1 before level 2 unlocks
  if(q && q.level===2 && !tp.levelGateChecked){
    tp.levelGateChecked = true;
    if((tp.correctByLevel[1]||0) < 3){
      div.innerHTML = `<div class="cover center">
        <span class="eyebrow">Almost there</span><h1>Keep practicing Level 1</h1>
        <p>You got ${tp.correctByLevel[1]||0}/4 on the basics. Score 3/4 or better to unlock Level 2 — tap the skill again from your dashboard for a fresh set.</p>
      </div><button class="btn block" id="back">Back to journey</button>`;
      app.appendChild(div);
      div.querySelector('#back').addEventListener('click', ()=>{ state.screen='dashboard'; render(); });
      return;
    }
  }

  if(tp.idx >= tp.questions.length){
    if(!tp.masteryApplied){
      tp.masteryApplied = true;
      const passed = tp.correct >= 6;
      if(passed){
        delete state.progress.mistakeTags[tp.tag];
        state.progress.masteredSkills[tp.tag] = { date: new Date().toISOString(), score: `${tp.correct}/${tp.questions.length}` };
        state.progress.gems = (state.progress.gems||0) + 10;
      }
      updateStreak();
      saveProfileToServer();
    }
    const passed = tp.correct >= 6;
    div.innerHTML = `<div class="cover center"><span class="eyebrow">Practice complete</span><h1>${tp.correct} / ${tp.questions.length}</h1>
      <p>${passed ? `🎉 Skill mastered! "${tp.tag.replace(/-/g,' ')}" is off your focus list.` : `Targeted practice: ${tp.tag.replace(/-/g,' ')} · keep at it, you'll get there.`}</p></div><button class="btn block" id="back">Back to journey</button>`;
    app.appendChild(div); div.querySelector('#back').addEventListener('click', ()=>{ state.screen='dashboard'; render(); }); return;
  }
  if(q.level===2 && !tp.shownLevelUp){
    div.innerHTML = `<button class="back-link" id="journeyBtn">← Journey</button>
    <div class="cover center">
      <span class="eyebrow">Level up</span><h1>🎯 Level 2 unlocked</h1>
      <p>Nice work on the basics. These next four get harder — longer sentences, closer reading.</p>
    </div><button class="btn block" id="continueBtn">Continue →</button>`;
    app.appendChild(div);
    div.querySelector('#journeyBtn').addEventListener('click', ()=>{ state.screen='dashboard'; render(); });
    div.querySelector('#continueBtn').addEventListener('click', ()=>{ tp.shownLevelUp = true; render(); });
    return;
  }
  div.innerHTML = `
    <div class="top-nav"><button class="back-link" id="journeyBtn">← Journey</button>
      <span class="mono muted" style="font-size:12px;">${tp.idx+1} / ${tp.questions.length}</span></div>
    <p class="muted" style="margin-top:-10px;margin-bottom:10px;">Targeted practice · ${tp.tag.replace(/-/g,' ')} · Level ${q.level||1}</p>
    <div class="card"><h2>${escapeHtml(q.prompt)}</h2>
      <div id="opts" style="margin-top:14px;">${q.options.map((o,idx)=>`<button class="option" data-idx="${idx}">${escapeHtml(o)}</button>`).join('')}</div>
      <p class="muted hidden" id="explain" style="margin-top:8px;"></p>
      <button class="btn block hidden" id="nextQ" style="margin-top:8px;">Continue →</button>
    </div>`;
  app.appendChild(div);
  div.querySelector('#journeyBtn').addEventListener('click', ()=>{ state.screen='dashboard'; render(); });
  const opts = div.querySelectorAll('.option'); let answered=false;
  opts.forEach(o=>o.addEventListener('click', ()=>{
    if(answered) return; answered=true;
    const chosen = q.options[parseInt(o.dataset.idx)]; const correct = chosen === q.answer;
    if(correct){
      o.style.borderColor='var(--good)'; o.style.background='#E9F5F1'; tp.correct++;
      tp.correctByLevel[q.level] = (tp.correctByLevel[q.level]||0)+1;
    }
    else{ o.style.borderColor='var(--danger)'; o.style.background='#FBEAE7'; }
    opts.forEach(x=>{ if(x.textContent===q.answer){ x.style.borderColor='var(--good)'; x.style.background='#E9F5F1'; } });
    const ex = div.querySelector('#explain'); ex.textContent = q.explanation||''; ex.classList.remove('hidden');
    div.querySelector('#nextQ').classList.remove('hidden');
  }));
  div.querySelector('#nextQ').addEventListener('click', ()=>{ tp.idx++; render(); });
}

function renderProgressPage(app){
  const div = document.createElement('div');
  const allHistory = state.progress.scoreHistory||[];
  const history = allHistory.slice(-8);
  let bodyHtml = '<p class="muted">Complete a few conversations and your progress will show up here.</p>';
  if(history.length > 0){
    const points = history.map(h=>{
      const nums = [h.scores.vocabulary, h.scores.grammar, h.scores.comprehension, h.scores.confidence].filter(v=>typeof v==='number');
      const avg = nums.length ? Math.round(nums.reduce((a,b)=>a+b,0)/nums.length) : 0;
      return { avg, date: h.date, stage: h.stage };
    });
    const overallAvg = Math.round(points.reduce((a,p)=>a+p.avg,0)/points.length);
    let trend = '→ Steady';
    if(points.length>=2){
      const half = Math.ceil(points.length/2);
      const firstAvg = points.slice(0,half).reduce((a,p)=>a+p.avg,0)/half;
      const secondAvg = points.slice(-half).reduce((a,p)=>a+p.avg,0)/half;
      if(secondAvg - firstAvg >= 5) trend = '↑ Improving';
      else if(firstAvg - secondAvg >= 5) trend = '↓ Needs practice';
    }
    const W = 320, H = 140, padL = 8, padR = 8, padT = 16, padB = 8;
    const stepX = points.length>1 ? (W-padL-padR)/(points.length-1) : 0;
    const yFor = v => padT + (100-v)/100 * (H-padT-padB);
    const coords = points.map((p,i)=>[padL + i*stepX, yFor(p.avg)]);
    const linePath = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    const areaPath = linePath + ` L${coords[coords.length-1][0].toFixed(1)},${H-padB} L${coords[0][0].toFixed(1)},${H-padB} Z`;
    const dotsSvg = coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="4" fill="var(--stamp)" stroke="var(--white)" stroke-width="2"/>`).join('');
    bodyHtml = `
      <div class="row" style="justify-content:space-between;margin-bottom:14px;">
        <div><div class="muted" style="font-size:12px;">Average score</div><div style="font-size:26px;font-family:'Fraunces',serif;">${overallAvg}</div></div>
        <div><div class="muted" style="font-size:12px;">Trend</div><div style="font-size:18px;font-family:'Fraunces',serif;">${trend}</div></div>
      </div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
        <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--line)" stroke-width="1"/>
        <path d="${areaPath}" fill="var(--paper2)" opacity="0.7"/>
        <path d="${linePath}" fill="none" stroke="var(--teal)" stroke-width="2.5"/>
        ${dotsSvg}
      </svg>
      <div class="row" style="justify-content:space-between;margin-top:4px;">
        <span class="muted" style="font-size:11px;">${new Date(points[0].date).toLocaleDateString()}</span>
        <span class="muted" style="font-size:11px;">${new Date(points[points.length-1].date).toLocaleDateString()}</span>
      </div>
      ${allHistory.length > 8 ? `<p class="muted" style="margin-top:10px;font-size:12.5px;">Showing your last 8 sessions of ${allHistory.length} total.</p>` : ''}
    `;
  }
  div.innerHTML = `
    <button class="back-link" id="backBtn">← Settings</button>
    <div class="cover"><span class="eyebrow">Your progress</span><h1>Score history</h1>
      <p>${allHistory.length} conversation${allHistory.length===1?'':'s'} scored so far.</p></div>
    <div class="card">${bodyHtml}</div>
  `;
  app.appendChild(div);
  div.querySelector('#backBtn').addEventListener('click', ()=>{ state.screen='settingsPage'; render(); });
}

/* ============================= INIT ============================= */
async function boot(){
  state.screen = 'loading'; render();
  const params = new URLSearchParams(window.location.search);
  const token = params.get('consent_token');
  if(token){
    state.consentToken = token;
    state.screen = 'consentConfirmPage';
    render();
    return;
  }
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if(!state.session){ state.screen='loginScreen'; render(); return; }
  try{
    await loadProfileFromServer();
    applyTheme(state.progress.themeId);
    const needsConsentGate = state.profile && state.profile.age && state.profile.age < 13 && !state.profile.guardianConsentAt;
    let restored = false;
    if(!needsConsentGate){
      try{
        const snap = sessionStorage.getItem('speakup_snapshot');
        if(snap){
          const parsed = JSON.parse(snap);
          if(RESUMABLE_SCREENS.includes(parsed.screen)){
            state.activeStage = parsed.activeStage;
            if(parsed.screen==='conversation' && parsed.convo){ state.convo = parsed.convo; state.convo.ended = false; }
            if(parsed.screen==='targetedPractice' && parsed.targetedPractice){ state.targetedPractice = parsed.targetedPractice; }
            if(parsed.screen==='diagnostic' && parsed.diag){ state.diag = parsed.diag; }
            if((parsed.screen==='dashboard' || parsed.screen==='diagResult' || parsed.screen==='welcome') && !(state.profile && state.profile.level) && parsed.screen!=='welcome'){
              // profile isn't ready for a level-dependent screen - fall through to default logic
            } else {
              state.screen = parsed.screen;
              restored = true;
            }
          }
        }
      }catch(e){}
    }
    if(!restored){
      if(needsConsentGate){
        state.screen = 'waitingForConsent';
      } else {
        state.screen = (state.profile && state.profile.level) ? 'dashboard' : 'welcome';
      }
    }
  }catch(e){
    console.error(e); state.screen='welcome';
  }
  render();
  if(state.screen==='conversation' && state.convo && !state.convo.ended){ startTimer(); }
}
sb.auth.onAuthStateChange((event, session)=>{
  state.session = session;
  if(event === 'PASSWORD_RECOVERY'){ state.screen='resetPassword'; render(); return; }
  if(event === 'SIGNED_IN'){ boot(); }
  if(event === 'SIGNED_OUT'){ state.screen='loginScreen'; render(); }
});
boot();
</script>
</body>
</html>
