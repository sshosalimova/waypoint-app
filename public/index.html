  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;

  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .btn.stamp{background:var(--stamp);color:var(--white);}
  .btn.teal{background:var(--teal);color:var(--white);}
  .btn.block{width:100%;justify-content:center;}

  .chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.45;}
  .msg.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.user{background:var(--ink);color:var(--white);align-self:flex-end;border-bottom-right-radius:4px;}
  .msg.system{align-self:center;color:var(--muted);font-size:12px;font-style:italic;}
  .chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);}
  .speed-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);}
  .speed-row input[type=range]{flex:1;}
  .timer{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;}
  .mic-btn{width:44px;height:44px;border-radius:50%;background:var(--paper2);flex-shrink:0;font-size:18px;}
  .mic-btn.recording{background:var(--stamp);color:white;}
  .score-bar-row{margin-bottom:14px;}
  .score-bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .score-bar-track{height:10px;background:var(--paper2);border-radius:6px;overflow:hidden;}

  .mistake-chip{display:inline-block;background:#FBEAE7;color:var(--stamp);border:1px solid #F0C7BF;padding:5px 11px;

  .spinner{width:26px;height:26px;border:3px solid var(--paper2);border-top-color:var(--teal);border-radius:50%;

  @keyframes spin{to{transform:rotate(360deg);}}
  .top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .back-link{color:var(--muted);font-size:14px;background:none;padding:6px 0;}
  .back-link:hover{color:var(--ink);}
  @media (max-width:420px){.path-choice{grid-template-columns:1fr;}}
</style>

let state = {

/* ============================= AUTH ============================= */
async function signUpUser(username, email, password){
  const clean = username.trim().toLowerCase();
  const { error } = await sb.auth.signUp({
    email, password,
    options:{ data:{ username: clean }, emailRedirectTo: window.location.href }
  });
  if(error) return error.message;
  try{
    const r = await fetch('/api/register-username', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: clean, email })
    });
    const json = await r.json();
    if(!r.ok) return json.error || 'Could not reserve that username.';
  }catch(e){ return 'Could not reserve that username.'; }
  return null;
}
async function loginUser(username, password){
  try{
    const lookup = await fetch('/api/login-lookup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: username.trim().toLowerCase() })
    });
    const lookupJson = await lookup.json();
    if(!lookup.ok) return lookupJson.error || 'Incorrect username or password.';
    const { error } = await sb.auth.signInWithPassword({ email: lookupJson.email, password });
    if(error) return 'Incorrect username or password.';
    return null;
  }catch(e){ return 'Something went wrong signing in.'; }
}
async function requestPasswordReset(username){
  try{
    const lookup = await fetch('/api/login-lookup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: username.trim().toLowerCase() })
    });
    const lookupJson = await lookup.json();
    if(!lookup.ok) return lookupJson.error || 'Username not found.';
    const { error } = await sb.auth.resetPasswordForEmail(lookupJson.email, { redirectTo: window.location.href });
    if(error) return error.message;
    return null;
  }catch(e){ return 'Something went wrong sending the reset email.'; }
}
async function setNewPassword(password){
  const { error } = await sb.auth.updateUser({ password });
  return error ? error.message : null;
}
async function signOut(){ await sb.auth.signOut(); state.session=null; state.profile=null; state.screen='loginScreen'; render(); }

/* ============================= BACKEND CALLS ============================= */
async function authedFetch(path, opts={}){
  const { data } = await sb.auth.getSession();
  const token = data.session ? data.session.access_token : null;
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(token) headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  const json = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(json.error || ('Request failed: '+res.status)); }
  return json;
}
async function loadProfileFromServer(){
  const { profile } = await authedFetch('/api/progress');
  if(profile){
    state.profile = {name:profile.name, path:profile.path, level:profile.level, currentStage:profile.current_stage};
    state.progress = {
      stagesCompleted: profile.stages_completed||[],
      mistakeTags: profile.mistake_tags||{},
      scoreHistory: profile.score_history||[],
    };
  } else {
    state.profile = null;
  }
}
async function saveProfileToServer(){
  await authedFetch('/api/progress', { method:'POST', body: JSON.stringify({
    name: state.profile.name, path: state.profile.path, level: state.profile.level,
    current_stage: state.profile.currentStage,
    stages_completed: state.progress.stagesCompleted,
    mistake_tags: state.progress.mistakeTags,
    score_history: state.progress.scoreHistory,
  })});
}
async function callBackend(endpoint, messages, system, maxTokens){
  const data = await authedFetch(endpoint, { method:'POST', body: JSON.stringify({messages, system}) });
  if(data.content) return data.content.map(b=>b.type==='text'?b.text:'').join('\n').trim();
  throw new Error('No content in response');
}
function extractJSON(text){
  let t = text.trim();
  t = t.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = t.indexOf('{'); const end = t.lastIndexOf('}');
  if(start>=0 && end>start){ t = t.slice(start, end+1); }
  return JSON.parse(t);
}

function render(){
  const app = document.getElementById('app'); app.innerHTML = '';
  const map = {
    loading: renderLoading, loginScreen: renderLoginScreen, signUpScreen: renderSignUpScreen,
    checkEmail: renderCheckEmail, forgotPassword: renderForgotPassword, resetPassword: renderResetPassword,
    welcome: renderWelcome, diagnostic: renderDiagnostic, diagResult: renderDiagResult,
    dashboard: renderDashboard, stageDetail: renderStageDetail, conversation: renderConversation,
    scoring: renderScoring, scoreResult: renderScoreResult, targetedPractice: renderTargetedPractice,
  };
  (map[state.screen] || renderLoginScreen)(app);
}

  const div = document.createElement('div');
  div.innerHTML = `

      <div class="stamp-mark">WAY<br>POINT</div>

  app.appendChild(div);

function renderDiagnostic(app){

  div.innerHTML = `

      <button class="btn block hidden" id="nextBtn" style="margin-top:8px;">Continue →</button>
    </div>`;
  app.appendChild(div);
  const opts = div.querySelectorAll('.option'); let picked = null;
  opts.forEach(o=>o.addEventListener('click', ()=>{
    if(picked!==null) return; picked = parseInt(o.dataset.idx);
    opts.forEach(x=>x.classList.remove('picked')); o.classList.add('picked');
    state.diag.totalByLevel[q.level] = (state.diag.totalByLevel[q.level]||0)+1;
    if(picked === q.a){ state.diag.correctByLevel[q.level] = (state.diag.correctByLevel[q.level]||0)+1; }
    div.querySelector('#nextBtn').classList.remove('hidden');
  }));
  div.querySelector('#nextBtn').addEventListener('click', ()=>{

  });
}
async function finishDiagnostic(){
  let level = "A1";
  for(const band of CEFR){
    const correct = state.diag.correctByLevel[band]||0; const total = state.diag.totalByLevel[band]||0;
    if(total>0 && correct/total >= 0.66){ level = band; }
  }
  const levelIdx = CEFR.indexOf(level); const startStage = Math.min(15, levelIdx*3 + 1);
  state.profile.level = level; state.profile.currentStage = startStage;
  await saveProfileToServer();
  state.screen = 'diagResult'; render();
}

/* ============================= CONVERSATION ============================= */
function beginConversation(stage){
  state.convo = {stage, messages:[], secondsLeft:180, speed:1, recognizing:false, usedVoice:false};
  state.screen='conversation'; render(); fetchAIReply(true); startTimer();
}
function convoSystemPrompt(stage){
  return `You are role-playing as a character in an English-speaking practice scenario for an ESL learner at CEFR level ${state.profile.level}.
Scenario: ${stage.scenario}
Rules:
- Stay fully in character - never break character or mention you are an AI.
- Speak in natural English calibrated to a ${state.profile.level} learner: simpler vocabulary/shorter sentences for A1/A2, natural idiomatic complexity for B1+.
- Keep each reply short: 1-3 sentences.
- Ask a question or prompt a response almost every turn.
- Do not correct the learner's grammar mid-conversation.
- Open the conversation with a natural first line appropriate to the scenario.`;
}
function apiMessagesFromConvo(){ return state.convo.messages.map(m=>({role: m.role==='ai'?'assistant':'user', content:m.text})); }
async function fetchAIReply(isOpening){
  const stage = state.convo.stage;
  try{
    const msgs = isOpening ? [{role:'user', content:'(Begin the scenario now with your opening line.)'}] : apiMessagesFromConvo();
    const reply = await callBackend('/api/chat', msgs, convoSystemPrompt(stage));
    state.convo.messages.push({role:'ai', text:reply}); render(); speakText(reply);
  }catch(e){
    state.convo.messages.push({role:'system', text:'('+(e.message||'Connection issue')+')'}); render();
  }
}
function speakText(text){
  try{ if(!window.speechSynthesis) return; window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = state.convo.speed; u.lang='en-US'; window.speechSynthesis.speak(u);
  }catch(e){}
}
function startTimer(){
  clearInterval(state.convo.timerId);
  state.convo.timerId = setInterval(()=>{
    state.convo.secondsLeft--;
    const el = document.getElementById('timerDisplay');
    if(el){ const m=Math.floor(Math.max(0,state.convo.secondsLeft)/60); const s=Math.max(0,state.convo.secondsLeft)%60;
      el.textContent = `${m}:${s.toString().padStart(2,'0')}`; }
    if(state.convo.secondsLeft<=0){ clearInterval(state.convo.timerId); endConversation(); }
  },1000);
}
function renderConversation(app){
  const s = state.convo.stage; const div = document.createElement('div');
  const m = Math.floor(Math.max(0,state.convo.secondsLeft)/60); const sec = Math.max(0,state.convo.secondsLeft)%60;
  div.innerHTML = `
    <div class="top-nav"><button class="back-link" id="backBtn">← Leave</button>
      <span class="timer mono" id="timerDisplay">${m}:${sec.toString().padStart(2,'0')}</span></div>
    <div class="chat-wrap">
      <div class="chat-head"><div><strong>${s.icon} ${s.title}</strong><div class="muted" style="font-size:12px;">${s.scenario}</div></div></div>
      <div class="chat-log" id="chatLog">${state.convo.messages.map(m=>`<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`).join('') || '<div class="msg system">Connecting…</div>'}</div>
      <div class="speed-row"><span>🐢</span><input type="range" min="0.6" max="1.4" step="0.1" value="${state.convo.speed}" id="speedSlider"><span>🐇</span>
        <span class="mono" id="speedVal">${state.convo.speed.toFixed(1)}x</span></div>
      <div class="chat-input-row"><button class="mic-btn" id="micBtn" title="Speak">🎤</button>
        <input type="text" id="chatInput" placeholder="Type your reply…"><button class="btn" id="sendBtn">Send</button></div>
    </div>
    <button class="btn block secondary" id="endBtn" style="margin-top:14px;">Finish &amp; get my score →</button>`;
  app.appendChild(div);
  const log = div.querySelector('#chatLog'); log.scrollTop = log.scrollHeight;
  div.querySelector('#backBtn').addEventListener('click', ()=>{
    clearInterval(state.convo.timerId); window.speechSynthesis && window.speechSynthesis.cancel();
    state.screen='stageDetail'; render();
  });
  div.querySelector('#endBtn').addEventListener('click', endConversation);
  div.querySelector('#speedSlider').addEventListener('input', (e)=>{
    state.convo.speed = parseFloat(e.target.value); div.querySelector('#speedVal').textContent = state.convo.speed.toFixed(1)+'x';
  });
  div.querySelector('#sendBtn').addEventListener('click', sendUserMessage);
  div.querySelector('#chatInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendUserMessage(); });
  div.querySelector('#micBtn').addEventListener('click', toggleMic);
}
function sendUserMessage(){
  const input = document.getElementById('chatInput'); const text = input.value.trim(); if(!text) return;
  state.convo.messages.push({role:'user', text}); input.value=''; render(); fetchAIReply(false);
}
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Voice input is not supported in this browser — please type your reply instead.'); return; }
  const btn = document.getElementById('micBtn');
  if(state.convo.recognizing){ state.convo._recognizer && state.convo._recognizer.stop(); return; }
  const rec = new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  state.convo._recognizer = rec; state.convo.recognizing = true; state.convo.usedVoice = true; btn.classList.add('recording');
  rec.onresult = (e)=>{ document.getElementById('chatInput').value = e.results[0][0].transcript; };
  rec.onend = ()=>{ state.convo.recognizing=false; btn.classList.remove('recording'); };
  rec.onerror = ()=>{ state.convo.recognizing=false; btn.classList.remove('recording'); };
  rec.start();
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

/* ============================= SCORING ============================= */
async function endConversation(){
  clearInterval(state.convo.timerId); window.speechSynthesis && window.speechSynthesis.cancel();
  if(state.convo.messages.filter(m=>m.role==='user').length===0){ state.screen='stageDetail'; render(); return; }
  state.screen='scoring'; render();
  const transcript = state.convo.messages.map(m=>`${m.role==='ai'?'Character':'Learner'}: ${m.text}`).join('\n');
  const sys = `You are an ESL assessment engine. You will receive a transcript of a roleplay conversation between a "Character" (AI) and a "Learner" (ESL student, target level ${state.profile.level}). Assess ONLY the Learner's lines.
Respond with ONLY valid JSON, no preamble, no markdown fences, matching exactly this shape:
{"scores": {"vocabulary": <0-100 int>, "grammar": <0-100 int>, "pronunciation": <0-100 int or null>, "comprehension": <0-100 int>, "confidence": <0-100 int>},
"mistakes": [{"tag": "<short-kebab-case-grammar-or-vocab-tag>", "example": "<short quote from learner>", "correction": "<corrected version>"}],
"feedback": "<2-3 sentence encouraging but honest feedback>"}
Scoring guidance: vocabulary=range/appropriateness of word choice; grammar=tense/agreement/preposition/word order correctness; pronunciation=null (no audio access); comprehension=relevance of responses; confidence=based on response length/directness. List 1-5 concrete mistakes with reusable tags like "past-simple-irregular", "preposition-choice", "subject-verb-agreement", "article-usage". Empty array if none found.
Transcript:
${transcript}`;
  try{
    const raw = await callBackend('/api/score', [{role:'user', content:'Assess this transcript now.'}], sys);
    const result = extractJSON(raw);
    state.lastScoreResult = result;
    state.progress.scoreHistory.push({date: new Date().toISOString(), stage: state.convo.stage.n, scores: result.scores});
    (result.mistakes||[]).forEach(m=>{ state.progress.mistakeTags[m.tag] = (state.progress.mistakeTags[m.tag]||0)+1; });
    if(!state.progress.stagesCompleted.includes(state.convo.stage.n)){ state.progress.stagesCompleted.push(state.convo.stage.n); }
    if(state.convo.stage.n === state.profile.currentStage && state.profile.currentStage < 15){ state.profile.currentStage += 1; }
    await saveProfileToServer();
    state.screen='scoreResult'; render();
  }catch(e){
    console.error(e); state.lastScoreResult = null; state.scoreError = e.message; state.screen='scoreResult'; render();
  }
}
function renderScoring(app){
  app.innerHTML = `<div class="center" style="padding-top:100px;"><div class="spinner"></div><p class="muted" style="margin-top:14px;">Scoring your conversation…</p></div>`;
}

    <button class="btn block secondary" id="backDash">Back to journey</button>`;

/* ============================= TARGETED PRACTICE ============================= */
async function startTargetedPractice(tag){
  state.targetedPractice = {loading:true, tag, questions:null, idx:0, correct:0};
  state.screen='targetedPractice'; render();
  const sys = `You are an ESL exercise generator. Create a short adaptive practice set targeting exactly this mistake pattern: "${tag}" for a learner at CEFR level ${state.profile.level}.
Respond with ONLY valid JSON, no markdown fences: {"questions":[{"prompt":"<question testing this exact pattern>","options":["a","b","c","d"],"answer":"<exact matching option text>","explanation":"<one sentence rule>"}]}
Create exactly 4 questions, varied wording, all targeting "${tag}".`;
  try{
    const raw = await callBackend('/api/practice', [{role:'user', content:'Generate the practice set now.'}], sys);
    const result = extractJSON(raw);
    state.targetedPractice = {loading:false, tag, questions:result.questions, idx:0, correct:0}; render();
  }catch(e){
    console.error(e); state.targetedPractice = {loading:false, tag, questions:[], idx:0, correct:0, error:e.message}; render();
  }
}
function renderTargetedPractice(app){
  const tp = state.targetedPractice; const div = document.createElement('div');
  if(tp.loading){
    div.innerHTML = `<div class="center" style="padding-top:100px;"><div class="spinner"></div><p class="muted" style="margin-top:14px;">Building practice for "${tp.tag.replace(/-/g,' ')}"…</p></div>`;
    app.appendChild(div); return;
  }
  if(tp.error || !tp.questions || tp.questions.length===0){
    div.innerHTML = `<div class="card"><h2>Couldn't build practice</h2><p class="muted">${tp.error||'Try again from the stage page.'}</p><button class="btn block" id="back">Back</button></div>`;
    app.appendChild(div); div.querySelector('#back').addEventListener('click', ()=>{ state.screen='dashboard'; render(); }); return;
  }
  if(tp.idx >= tp.questions.length){
    div.innerHTML = `<div class="cover center"><span class="eyebrow">Practice complete</span><h1>${tp.correct} / ${tp.questions.length}</h1>
      <p>Targeted practice: ${tp.tag.replace(/-/g,' ')}</p></div><button class="btn block" id="back">Back to journey</button>`;
    app.appendChild(div); div.querySelector('#back').addEventListener('click', ()=>{ state.screen='dashboard'; render(); }); return;
  }
  const q = tp.questions[tp.idx];
  div.innerHTML = `
    <div class="top-nav"><span class="eyebrow">Targeted practice · ${tp.tag.replace(/-/g,' ')}</span>
      <span class="mono muted" style="font-size:12px;">${tp.idx+1} / ${tp.questions.length}</span></div>
    <div class="card"><h2>${escapeHtml(q.prompt)}</h2>
      <div id="opts" style="margin-top:14px;">${q.options.map((o,idx)=>`<button class="option" data-idx="${idx}">${escapeHtml(o)}</button>`).join('')}</div>
      <p class="muted hidden" id="explain" style="margin-top:8px;"></p>
      <button class="btn block hidden" id="nextQ" style="margin-top:8px;">Continue →</button>
    </div>`;
  app.appendChild(div);
  const opts = div.querySelectorAll('.option'); let answered=false;
  opts.forEach(o=>o.addEventListener('click', ()=>{
    if(answered) return; answered=true;
    const chosen = q.options[parseInt(o.dataset.idx)]; const correct = chosen === q.answer;
    if(correct){ o.style.borderColor='var(--good)'; o.style.background='#E9F5F1'; tp.correct++; }
    else{ o.style.borderColor='var(--danger)'; o.style.background='#FBEAE7'; }
    opts.forEach(x=>{ if(x.textContent===q.answer){ x.style.borderColor='var(--good)'; x.style.background='#E9F5F1'; } });
    const ex = div.querySelector('#explain'); ex.textContent = q.explanation||''; ex.classList.remove('hidden');
    div.querySelector('#nextQ').classList.remove('hidden');
  }));
  div.querySelector('#nextQ').addEventListener('click', ()=>{ tp.idx++; render(); });
}

/* ============================= INIT ============================= */
async function boot(){
  state.screen = 'loading'; render();
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if(!state.session){ state.screen='loginScreen'; render(); return; }
  try{
    await loadProfileFromServer();
    state.screen = (state.profile && state.profile.level) ? 'dashboard' : 'welcome';
  }catch(e){
    console.error(e); state.screen='welcome';
  }
  render();
}
sb.auth.onAuthStateChange((event, session)=>{
  state.session = session;
  if(event === 'PASSWORD_RECOVERY'){ state.screen='resetPassword'; render(); return; }
  if(event === 'SIGNED_IN'){ boot(); }
  if(event === 'SIGNED_OUT'){ state.screen='loginScreen'; render(); }
});
boot();
</script>
